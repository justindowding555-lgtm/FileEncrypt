name: Rust tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
